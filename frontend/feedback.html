<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avalie seu atendimento | Vynce</title><style>body{margin:0;background:#f7f8fb;font-family:Arial,sans-serif;color:#202534}.box{max-width:520px;margin:10vh auto;background:#fff;border:1px solid #e6e8ee;border-radius:18px;padding:32px;text-align:center;box-shadow:0 18px 50px #20253412}.faces{display:flex;justify-content:center;gap:10px;margin:25px 0}.faces button{font-size:29px;border:1px solid #e4e5ea;background:#fff;border-radius:12px;padding:10px;cursor:pointer}.faces button.active{border-color:#6558e8;background:#f3f1ff}textarea{width:100%;box-sizing:border-box;min-height:100px;border:1px solid #ddd;border-radius:10px;padding:12px}#send{margin-top:15px;border:0;border-radius:10px;background:#5b4df7;color:#fff;padding:12px 22px;font-weight:700}.muted{color:#697386}</style></head><body><main class="box"><img src="logo.png" alt="Vynce" width="45"><h1>Como foi seu atendimento?</h1><p class="muted" id="who">Sua opinião ajuda a melhorar a experiência.</p><div class="faces"><button data-v="1">😞</button><button data-v="2">😐</button><button data-v="3">🙂</button><button data-v="4">😄</button><button data-v="5">🤩</button></div><textarea id="comment" maxlength="1000" placeholder="Conte um pouco mais (opcional)"></textarea><br><button id="send">Enviar avaliação</button><p id="msg"></p></main><script src="auth.js"></script><script src="api.js"></script><script>const token=new URLSearchParams(location.search).get('token');let rating=0;document.querySelectorAll('.faces button').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.v);document.querySelectorAll('.faces button').forEach(x=>x.classList.toggle('active',x===b))});Api.get('/feedback/public?token='+encodeURIComponent(token||''),{auth:false}).then(x=>{if(x.client_name)document.getElementById('who').textContent=x.client_name+', sua opinião ajuda a melhorar a experiência.'}).catch(e=>document.getElementById('msg').textContent=e.message);document.getElementById('send').onclick=async()=>{if(!rating){document.getElementById('msg').textContent='Escolha uma carinha.';return}try{await Api.post('/feedback/public',{token,rating,comment:document.getElementById('comment').value},{auth:false});document.querySelector('.box').innerHTML='<h1>Obrigado! 💜</h1><p class="muted">Sua avaliação foi registrada.</p>'}catch(e){document.getElementById('msg').textContent=e.message}}</script></body></html>
